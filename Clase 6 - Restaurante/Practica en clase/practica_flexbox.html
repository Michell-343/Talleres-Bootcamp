<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor{
            display: flex;
padding: 50px;
           justify-content: space-between;
           align-items: center;
            gap: 20px; /* separa, da espaciado*/
            background-color: aqua;
        }

        .contenedor2{
            display: flex;
            flex-direction: column;
            padding: 50px;
           justify-content: space-between;
           align-items: center;
            gap: 20px; /* separa, da espaciado*/
            background-color: rgb(44, 168, 168);
        }

        .caja{
            background-color: blueviolet;
            padding: 28px;
            color: aliceblue;
        }
        .contenedor3{
            background-color: bisque;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
            padding: 20px;
        }

        .caja2{
            background-color: brown;
            padding: 40px;
            text-align: center;
            color: azure;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            width: 30%;
        }

        img{
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="caja">Caja 1</div>
        <div class="caja">Caja 2</div>
        <div class="caja">Caja 3</div>
    </div>

    <div class="contenedor2">
        <div class="caja">Caja 1</div>
        <div class="caja">Caja 2</div>
        <div class="caja">Caja 3</div>
    </div>

    <div class="contenedor3">
        <div class="caja2">Caja 1</div>
        <div class="caja2">Caja 2</div>
        <div class="caja2">Caja 3</div>
        <div class="caja2">Caja 4</div>
        <div class="caja2">Caja 5</div>
        <div class="caja2">Caja 6</div>

        <div class="caja2">
            <figure>
                <img src="peru.jpg" alt="">
            </figure>
        </div>
        <div class="caja2">
            <figure>
                <img src="peru.jpg" alt="">
            </figure>
        </div>
        <div class="caja2">
            <figure>
                <img src="peru.jpg" alt="">
            </figure>
        </div>
          
    </div>
</body>
</html>
