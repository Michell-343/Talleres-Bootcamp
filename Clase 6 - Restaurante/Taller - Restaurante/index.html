<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
            <nav>
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#seccion-menu">Menú</a></li>
                    <li><a href="#">Galeria</a></li>
                    <li><a href="">Contacto</a></li>

                </ul>
            </nav>
            <h1>Sazón Latino </h1>

    </header>

    <main>
        <section class="seccion-recomendados">
            <h2>Recomendaciones</h2>
            <div class="contenedor-recomendados">
                <div class="caja-recomendados">
                    <figure>
                        <img src="./multimedia/plato 1.png" alt="plato1">
                        <h3>Plato 1</h3>
                        <p> “Son deliciosas y versátiles, perfectas para el desayuno o la cena. Me encanta rellenarlas con queso y carne mechada. ¡Un clásico que no decepciona!”</p>
                    </figure>
                </div>
                <div class="caja-recomendados">
                    <figure>
                        <img src="./multimedia/plato 2.png" alt="plato1">
                        <h3>Plato 2</h3>
                        <p> “La combinación de pescado fresco, limón y especias es simplemente perfecta. Es un plato refrescante y lleno de sabor, ideal para días calurosos.”</p>
                    </figure>
                </div>
                <div class="caja-recomendados">
                    <figure>
                        <img src="./multimedia/plato 3.png" alt="plato1">
                        <h3>Plato 3</h3>
                        <p> “La carne marinada con ese toque dulce de la piña es espectacular. Siempre los pido con cilantro y cebolla, ¡un verdadero manjar mexicano!”</p>
                    </figure>
                </div>
                <div class="caja-recomendados">
                    <figure>
                        <img src="./multimedia/plato 2.png" alt="plato1">
                        <h3>Plato 2</h3>
                        <p> “La combinación de pescado fresco, limón y especias es simplemente perfecta. Es un plato refrescante y lleno de sabor, ideal para días calurosos.”</p>
                    </figure>

            </div>
        </section>

        <section id="seccion-menu" class="seccion-menu">
            <h2>Nuestro menú</h2>
            <div class="contenedor-menu">
                <div class="caja-menu">
                    <figure>
                        <img src="./multimedia/menu1.png" alt="">
                        <h3>Platillo 1</h3>
                        <p>Un festín de sabores con frijoles, arroz, carne molida, chicharrón, huevo frito, plátano maduro, arepa y aguacate, que combina lo dulce, salado y crujiente en un solo plato.</p>
                    </figure>
                </div>
                <div class="caja-menu">
                    <figure>
                        <img src="./multimedia/menu2.png" alt="">
                        <h3>Platillo 2</h3>
                        <p>Masa suave y dorada rellena de carne sazonada, cebolla, huevo y especias, perfecta mezcla de jugosidad y sabor tradicional.</p>
                    </figure>
                </div>
                <div class="caja-menu">
                    <figure>
                        <img src="./multimedia/menu3.png" alt="">
                        <h3>Platillo 3</h3>
                        <p>Un guiso robusto de frijoles negros, carne de cerdo y embutidos, acompañado de arroz y naranja, con un toque ahumado y reconfortante.</p>
                    </figure>
                </div>
                <div class="caja-menu">
                    <figure>
                        <img src="./multimedia/menu4.png" alt="">
                        <h3>Platillo 4</h3>
                        <p>Tortillas de maíz rellenas de queso, frijoles o chicharrón, servidas con curtido y salsa, que ofrecen un equilibrio entre lo cremoso y lo crujiente.</p>
                    </figure>
                </div>
                <div class="caja-menu">
                    <figure>
                        <img src="./multimedia/menu5.png" alt="">
                        <h3>Platillo 5</h3>
                        <p>Carne de res desmechada cocida con pimientos, tomate y especias, un guiso jugoso que combina perfectamente con arroz blanco.</p>
                    </figure>
                </div>
                <div class="caja-menu">
                    <figure>
                        <img src="./multimedia/menu6.png" alt="">
                        <h3>Platillo 6</h3>
                        <p>Chiles poblanos rellenos de carne y frutas, bañados con crema de nuez y granada, una explosión de sabores dulces, salados y frescos.</p>
                    </figure>
                </div>
            </div>
            <button>Ver mas</button>
        </section>
    </main>

    <footer>
        <img src="./multimedia/Logo.png" alt="">
        <p>Contáctanos 300000</p>
        <p>&copy; 2024 - Michell Inagan</p>
    </footer>

</body>
</html>
